.0;"/><!--link Notificador to NotificadorSmsSimulado--><path d="M253.25,88.28 C253.25,88.28 253.25,127.73 253.25,127.73 " fill="none" id="Notificador-NotificadorSmsSimulado" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="none" points="246.25,88.28,253.25,68.28,260.25,88.28,246.25,88.28" style="stroke: #A80036; stroke-width: 1.0;"/><!--link NotificadorPushFcmSimulado to ClienteFcmFalso--><path d="M119.5,188.28 C119.5,188.28 119.5,242.73 119.5,242.73 " fill="none" id="NotificadorPushFcmSimulado-ClienteFcmFalso" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="119.5,247.73,123.5,238.73,119.5,242.73,115.5,238.73,119.5,247.73" style="stroke: #A80036; stroke-width: 1.0;"/><!--link NotificadorSmsSimulado to ProveedorSmsFalso--><path d="M315.5,188.28 C315.5,188.28 315.5,242.73 315.5,242.73 " fill="none" id="NotificadorSmsSimulado-ProveedorSmsFalso" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="315.5,247.73,319.5,238.73,315.5,242.73,311.5,238.73,315.5,247.73" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml
skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam linetype ortho
skinparam stereotypeCBackgroundColor #FFE8B0
skinparam noteBackgroundColor #FFFFFF
skinparam noteBorderColor #888888
hide empty members
hide circle
class ServicioEscalamiento <<Client>>
interface Notificador <<Target>> {
  + enviar(accion)
}
class NotificadorPushFcmSimulado <<Adapter>> {
  + enviar(accion)
}
class NotificadorSmsSimulado <<Adapter>> {
  + enviar(accion)
}
class ClienteFcmFalso <<Adaptee>> {
  + send(token, payload)
}
class ProveedorSmsFalso <<Adaptee>> {
  + sendMessage(numero, texto)
}
ServicioEscalamiento -right-> Notificador
Notificador <|.. NotificadorPushFcmSimulado
Notificador <|.. NotificadorSmsSimulado
NotificadorPushFcmSimulado - -> ClienteFcmFalso
NotificadorSmsSimulado - -> ProveedorSmsFalso
note right of Notificador : Cada adaptador traduce la\nacción al formato del proveedor.
@enduml

