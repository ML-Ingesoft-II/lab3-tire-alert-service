endido--><rect fill="#FEFECE" height="39.0391" id="EstadoAtendido" style="stroke: #A80036; stroke-width: 1.5;" width="99" x="446.5" y="190"/><text fill="#000000" font-family="Helvetica" font-size="12" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="97" x="447.5" y="206.625">«ConcreteState»</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="88" x="452" y="221.1445">EstadoAtendido</text><path d="M6,289 L6,330.459 A0,0 0 0 0 6,330.459 L192,330.459 A0,0 0 0 0 192,330.459 L192,299 L182,289 L144,289 L140,229.26 L136,289 L6,289 A0,0 0 0 0 6,289 " fill="#FFFFFF" style="stroke: #888888; stroke-width: 1.0;"/><path d="M182,289 L182,299 L192,299 L182,289 " fill="#FFFFFF" style="stroke: #888888; stroke-width: 1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="112" x="12" y="306.5938">Nivel: precaución.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="165" x="12" y="322.3232">Pasa a escalado al escalar.</text><path d="M227,289 L227,330.459 A0,0 0 0 0 227,330.459 L405,330.459 A0,0 0 0 0 405,330.459 L405,299 L395,289 L320,289 L316,229.26 L312,289 L227,289 A0,0 0 0 0 227,289 " fill="#FFFFFF" style="stroke: #888888; stroke-width: 1.0;"/><path d="M395,289 L395,299 L405,299 L395,289 " fill="#FFFFFF" style="stroke: #888888; stroke-width: 1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="80" x="233" y="306.5938">Nivel: crítico.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="157" x="233" y="322.3232">Agrega nuevas acciones.</text><path d="M440,289 L440,330.459 A0,0 0 0 0 440,330.459 L646,330.459 A0,0 0 0 0 646,330.459 L646,299 L636,289 L500,289 L496,229.26 L492,289 L440,289 A0,0 0 0 0 440,289 " fill="#FFFFFF" style="stroke: #888888; stroke-width: 1.0;"/><path d="M636,289 L63